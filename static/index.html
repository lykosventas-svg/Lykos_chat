<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lykos Chat AI Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <img class="logo-icon" src="https://lykos.mx/wp-content/uploads/2020/04/cropped-Logotipo-Lykos.png" alt="Lykos Logo">
                <div>
                    <h1 class="logo-title"><span class="logo-title-dark">Lykos Chat</span> <span class="logo-title-light">AI Chatbot</span></h1>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Chat Area -->
        <div class="chat-container" id="chatContainer">
            <div class="messages" id="messages"></div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="Escriba su pregunta aquí..." 
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button class="btn btn-primary" id="btnSend" onclick="sendMessage()">
                        ➤
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="spinner"></div>
        <p id="loadingText">Procesando...</p>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
